name: Build and publish Modrinth devbuild

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Modrinth
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_GAME_VERSIONS: ${{ vars.MODRINTH_GAME_VERSIONS || '["1.16.x","1.17.x","1.18.x","1.19.x","1.20.x","1.21.x", "26.1", "26.2", "26.3.x"]' }}
    steps:
      - name: Check out the module
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'

      - name: Build and run tests
        id: build
        shell: bash
        run: |
          # The JAR name follows archives_base_name in gradle.properties.
          archive_base=$(sed -nE 's/^[[:space:]]*archives_base_name[[:space:]]*=[[:space:]]*([[:alnum:]_.-]+)[[:space:]]*$/\1/p' gradle.properties)
          version="alpha-${GITHUB_SHA:0:7}"
          gradle build "-Pmodule_version=$version"
          {
            echo "version=$version"
            echo "jar=build/libs/$archive_base-$version.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Publish the devbuild to Modrinth
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && vars.MODRINTH_PUBLISH_ON_PUSH == 'true') }}
        uses: cloudnode-pro/modrinth-publish@b9509165154967230d3a8f4fab4dd56fc533a30d # v2.5.3
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          version: ${{ steps.build.outputs.version }}
          channel: alpha
          files: ${{ steps.build.outputs.jar }}
          loaders: velocity
          game-versions: ${{ env.MODRINTH_GAME_VERSIONS }}
          dependencies: >-
            [
              {"project_id":"Hd02Faj9","dependency_type":"required"},
              {"project_id":"b227Xhmj","dependency_type":"required"}
            ]
          changelog: |
            ${{ github.event.head_commit.message || 'Manual development build.' }}

            [View commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
